<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zarvis — Professional Documents, Instantly</title>
  
  <!-- ===== GOOGLE FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== ROOT VARIABLES ===== */
    :root {
      --bg-primary: #0A0F1E;
      --bg-surface: #111827;
      --border-color: #1F2937;
      --gold: #C9A84C;
      --gold-soft: rgba(201, 168, 76, 0.12);
      --blue: #3B82F6;
      --text-primary: #F9FAFB;
      --text-secondary: #9CA3AF;
      --success: #10B981;
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
    }

    /* ===== BASIC RESET ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== APP WRAPPER ===== */
    .app-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== TOP HEADER BAR ===== */
    .top-bar {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      animation: fadeInDown 0.6s ease;
      gap: 1rem;
    }

    .logo {
      font-family: var(--font-body);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--gold);
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .region-select {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: var(--gold);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .region-select:hover,
    .region-select:focus {
      border-color: var(--gold);
    }

    /* ===== MAIN CONTAINER ===== */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      animation: fadeInLeft 0.5s ease 0.1s both;
    }

    .sidebar-header {
      padding: 1.5rem 1.25rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
    }

    .doc-list {
      list-style: none;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow-y: auto;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.25s ease;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .doc-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    .doc-item.active {
      background: var(--gold-soft);
      color: var(--gold);
      border-left-color: var(--gold);
      font-weight: 600;
    }

    .doc-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    /* ===== MOBILE DOCUMENT SELECTOR ===== */
    .mobile-doc-select {
      display: none;
      padding: 1rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .mobile-doc-select select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
    }

    /* ===== CONTENT AREA ===== */
    .content-area {
      flex: 1;
      display: flex;
      overflow: hidden;
      animation: fadeInUp 0.5s ease 0.2s both;
    }

    /* ===== FORM PANEL ===== */
    .form-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      border-right: 1px solid var(--border-color);
      min-width: 0;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      max-width: 320px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .form-content {
      max-width: 720px;
    }

    .doc-title {
      font-family: var(--font-heading);
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    /* ===== FORM GRID ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .form-field.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.15);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .field-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.8;
    }

    .char-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: right;
      margin-top: 0.25rem;
    }

    /* ===== GENERATE BUTTON ===== */
    .generate-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--gold);
      color: #0A0F1E;
      border: none;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(201, 168, 76, 0.25);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s ease;
    }

    .generate-btn:hover::after {
      left: 100%;
    }

    /* ===== PREVIEW PANEL ===== */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      min-width: 0;
    }

    .preview-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1rem;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-soft);
    }

    .preview-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .document-paper {
      background: #fff;
      color: #111;
      max-width: 210mm;
      margin: 0 auto;
      padding: 2.5rem;
      min-height: 297mm;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      border-radius: 2px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11.5pt;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .placeholder-hint {
      color: #B45309;
      background: rgba(196, 181, 146, 0.15);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.95em;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== RESPONSIVE BREAKPOINTS ===== */
    @media (max-width: 1024px) {
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      
      .doc-list {
        flex-direction: row;
        overflow-x: auto;
        padding: 0.75rem;
        gap: 0.5rem;
      }
      
      .doc-item {
        white-space: nowrap;
        border-left: none;
        border-bottom: 3px solid transparent;
      }
      
      .doc-item.active {
        border-left-color: transparent;
        border-bottom-color: var(--gold);
      }
      
      .main-container {
        flex-direction: column;
      }
      
      .content-area {
        flex-direction: column;
      }
      
      .form-panel {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        max-height: 50vh;
      }
      
      .tagline {
        display: none;
      }
    }

    @media (max-width: 767px) {
      .top-bar {
        padding: 0 1rem;
        height: 56px;
      }
      
      .header-controls {
        gap: 0.75rem;
      }
      
      .region-select {
        font-size: 0.8rem;
        padding: 0.4rem 0.5rem;
      }
      
      .sidebar {
        display: none;
      }
      
      .mobile-doc-select {
        display: block;
      }
      
      .main-container {
        flex-direction: column;
      }
      
      .content-area {
        flex-direction: column;
      }
      
      .form-panel {
        padding: 1.25rem;
        border: none;
        max-height: none;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .preview-panel {
        min-height: 50vh;
      }
      
      .document-paper {
        padding: 1.5rem;
        font-size: 10.5pt;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <header class="top-bar">
      <div class="logo">Zar<span>vis</span></div>
      <div class="header-controls">
        <div class="tagline">Professional Documents, Instantly</div>
        <select class="region-select" id="regionSelect" onchange="changeRegion(this.value)">
          <option value="india">India 🇮🇳</option>
          <option value="usa">United States 🇺🇸</option>
          <option value="canada">Canada 🇨🇦</option>
          <option value="uk">United Kingdom 🇬🇧</option>
          <option value="eu">European Union 🇪🇺</option>
          <option value="international">International 🌍</option>
        </select>
      </div>
    </header>

    <div class="main-container">
      
      <aside class="sidebar">
        <div class="sidebar-header">Document Type</div>
        <ul class="doc-list" id="docList"></ul>
      </aside>

      <main class="content-area">
        
        <div class="mobile-doc-select" id="mobileDocSelect">
          <select id="mobileSelect">
            <option value="">Select Document Type...</option>
          </select>
        </div>

        <div class="form-panel" id="formPanel">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📄</div>
            <h3>Select a document type to begin</h3>
            <p>Choose from the sidebar to generate professional business documents instantly.</p>
          </div>

          <div class="form-content" id="formContent" style="display: none;">
            <h2 class="doc-title" id="docTitle"></h2>
            <div class="form-grid" id="formGrid"></div>
            <button class="generate-btn" onclick="printDocument()">
              Download / Print Document
            </button>
          </div>
        </div>

        <div class="preview-panel">
          <div class="preview-header">
            <span>Live Preview</span>
            <button class="copy-btn" onclick="copyToClipboard()" title="Copy to clipboard">📋</button>
          </div>
          <div class="preview-content" id="previewContent"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    // ===== REGION CONFIGURATION =====
    // Each region defines currency, date style, address hints, and legal terminology.
    const REGION_CONFIG = {
      india: {
        name: 'India',
        currency: '₹',
        dateFormat: 'DD Month YYYY',
        dateHint: 'DD/MM/YYYY',
        addrHint: 'Full address with PIN code',
        stateLabel: 'State',
        pinLabel: 'PIN Code',
        employmentType: 'permanent with probation',
        noticePeriod: 'one month',
        rentalDepositMonths: 2,
        rentalNotice: 'one month'
      },
      usa: {
        name: 'United States',
        currency: '$',
        dateFormat: 'Month DD, YYYY',
        dateHint: 'MM/DD/YYYY',
        addrHint: 'Street, City, State ZIP',
        stateLabel: 'State',
        pinLabel: 'ZIP Code',
        employmentType: 'at-will employment',
        noticePeriod: 'at-will (no fixed notice)',
        rentalDepositMonths: 1,
        rentalNotice: '30 days'
      },
      canada: {
        name: 'Canada',
        currency: 'C$',
        dateFormat: 'Month DD, YYYY',
        dateHint: 'MM/DD/YYYY',
        addrHint: 'Street, City, Province Postal Code',
        stateLabel: 'Province',
        pinLabel: 'Postal Code',
        employmentType: 'permanent with probation per provincial standards',
        noticePeriod: 'per provincial Employment Standards Code',
        rentalDepositMonths: 'half month (varies by province)',
        rentalNotice: 'per provincial tenancy act'
      },
      uk: {
        name: 'United Kingdom',
        currency: '£',
        dateFormat: 'DD Month YYYY',
        dateHint: 'DD/MM/YYYY',
        addrHint: 'Street, City, Postcode',
        stateLabel: 'County',
        pinLabel: 'Postcode',
        employmentType: 'permanent with statutory rights',
        noticePeriod: 'statutory minimum (one week per year)',
        rentalDepositMonths: '5 weeks (Deposit Protection Scheme)',
        rentalNotice: 'two months (AST standard)'
      },
      eu: {
        name: 'European Union',
        currency: '€',
        dateFormat: 'DD Month YYYY',
        dateHint: 'DD/MM/YYYY',
        addrHint: 'Street, City, Postal Code, Country',
        stateLabel: 'Region',
        pinLabel: 'Postal Code',
        employmentType: 'permanent under EU Directive 2019/1152',
        noticePeriod: 'per Member State law (typically 1–3 months)',
        rentalDepositMonths: 'max 3 months (varies by Member State)',
        rentalNotice: 'per local tenancy law (typically 3 months)'
      },
      international: {
        name: 'International',
        currency: '$',
        dateFormat: 'DD Month YYYY',
        dateHint: 'DD/MM/YYYY',
        addrHint: 'Full address including country',
        stateLabel: 'State / Province',
        pinLabel: 'Postal Code',
        employmentType: 'standard employment',
        noticePeriod: 'one month',
        rentalDepositMonths: 1,
        rentalNotice: '30 days'
      }
    };

    // ===== CURRENT STATE =====
    let currentRegion = 'india';
    let currentDoc = null;

    // ===== DOCUMENT DEFINITIONS =====
    // Each document provides fields and a template generator function that accepts region.
    const DOCUMENT_TYPES = [
      {
        id: 'rental',
        name: 'Rental Agreement',
        icon: '🏠',
        getFields: (r) => {
          const cfg = REGION_CONFIG[r];
          return [
            { key: 'landlordName', label: 'Landlord Full Name', type: 'text', placeholder: 'e.g. Rajesh Kumar Sharma', hint: 'As per government ID' },
            { key: 'landlordAddress', label: 'Landlord Address', type: 'textarea', placeholder: 'Full address', hint: cfg.addrHint },
            { key: 'tenantName', label: 'Tenant Full Name', type: 'text', placeholder: 'e.g. Priya Singh', hint: 'As per government ID' },
            { key: 'tenantPhone', label: 'Tenant Phone Number', type: 'text', placeholder: 'e.g. +1 987-654-3210', hint: 'Active contact number' },
            { key: 'propertyAddress', label: 'Property Full Address', type: 'textarea', placeholder: 'Complete property address', hint: 'Address as per property records' },
            { key: 'rentAmount', label: `Monthly Rent (${cfg.currency})`, type: 'text', placeholder: 'e.g. 1500', hint: `In ${cfg.currency}` },
            { key: 'securityDeposit', label: `Security Deposit (${cfg.currency})`, type: 'text', placeholder: 'e.g. 3000', hint: `Usually ${cfg.rentalDepositMonths} month(s)` },
            { key: 'startDate', label: 'Agreement Start Date', type: 'date', hint: cfg.dateHint },
            { key: 'duration', label: 'Duration (Months)', type: 'select', options: ['6', '11', '12', '24'], hint: 'Standard lease duration' },
            { key: 'city', label: 'City', type: 'text', placeholder: 'e.g. New York', hint: 'City where property is located' }
          ];
        },
        getTemplate: (r) => {
          const cfg = REGION_CONFIG[r];
          if (r === 'india') {
            return `RENTAL AGREEMENT

This Rental Agreement is entered into on {{START_DATE}}, between:

LANDLORD: {{LANDLORD_NAME}}, residing at {{LANDLORD_ADDRESS}} (hereinafter referred to as the "Landlord")

AND

TENANT: {{TENANT_NAME}}, Contact: {{TENANT_PHONE}} (hereinafter referred to as the "Tenant")

PROPERTY: The Landlord agrees to let out the property situated at {{PROPERTY_ADDRESS}} to the Tenant for residential purposes.

TERMS AND CONDITIONS:

1. DURATION: This agreement shall be valid for a period of {{DURATION}} months commencing from {{START_DATE}}.

2. RENT: The monthly rent shall be ${cfg.currency}{{RENT_AMOUNT}}/-, payable on or before the 5th of every month.

3. SECURITY DEPOSIT: The Tenant has paid a security deposit of ${cfg.currency}{{SECURITY_DEPOSIT}}/- which shall be refunded at the time of vacating the premises, subject to deductions for damages, if any.

4. UTILITIES: The Tenant shall bear all charges for electricity, water, and other utilities consumed during the tenancy period.

5. MAINTENANCE: The Tenant shall maintain the property in good condition and shall not make any structural changes without prior written consent of the Landlord.

6. TERMINATION: Either party may terminate this agreement by giving ${cfg.rentalNotice}' prior written notice.

7. SUBLETTING: The Tenant shall not sublet the premises or any part thereof without the written consent of the Landlord.

IN WITNESS WHEREOF, the parties hereto have set their hands on the day and year first above written at {{CITY}}.


LANDLORD                                    TENANT
{{LANDLORD_NAME}}                           {{TENANT_NAME}}
Signature: _______________                  Signature: _______________


WITNESS 1: _______________                  WITNESS 2: _______________`;
          } else if (r === 'usa') {
            return `RESIDENTIAL LEASE AGREEMENT

This Lease Agreement is made on {{START_DATE}}, by and between:

LANDLORD: {{LANDLORD_NAME}}, of {{LANDLORD_ADDRESS}} ("Landlord")

AND

TENANT: {{TENANT_NAME}}, Phone: {{TENANT_PHONE}} ("Tenant")

PREMISES: The Landlord hereby leases to the Tenant the residential property located at {{PROPERTY_ADDRESS}}.

1. TERM: The lease term shall be for {{DURATION}} months, beginning on {{START_DATE}}.

2. RENT: Tenant agrees to pay monthly rent of ${cfg.currency}{{RENT_AMOUNT}}, due on the 1st of each month. Late payments shall incur a late fee as permitted by state law.

3. SECURITY DEPOSIT: A security deposit of ${cfg.currency}{{SECURITY_DEPOSIT}} is held by the Landlord in accordance with state security deposit laws and shall be returned within the timeframe required by law, less lawful deductions.

4. UTILITIES: Tenant is responsible for all utilities including electricity, gas, water, sewer, trash, and internet unless otherwise agreed in writing.

5. USE: The premises shall be used strictly as a private residence. Tenant shall not conduct business or illegal activity on the premises.

6. MAINTENANCE: Tenant shall keep the premises clean and sanitary. No alterations or redecorating shall be made without Landlord's prior written consent.

7. TERMINATION: Either party may terminate this lease by giving ${cfg.rentalNotice}' written notice, or as otherwise required by state law.

8. SUBLETTING: Tenant shall not sublet, assign, or transfer this lease without prior written consent of the Landlord.

9. LEAD PAINT DISCLOSURE: If the premises were built before 1978, Tenant acknowledges receipt of the Lead-Based Paint Disclosure required by federal law.

IN WITNESS WHEREOF, the parties have executed this agreement at {{CITY}}.


___________________________                ___________________________
Landlord: {{LANDLORD_NAME}}                Tenant: {{TENANT_NAME}}
Date: _______________                      Date: _______________`;
          } else if (r === 'canada') {
            return `RESIDENTIAL TENANCY AGREEMENT

This Residential Tenancy Agreement is entered into on {{START_DATE}} between:

LANDLORD: {{LANDLORD_NAME}}, of {{LANDLORD_ADDRESS}} ("Landlord")

AND

    function formatDate(dateStr, region) {
      if (!dateStr) return '[Date]';
      const months = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
      const d = new Date(dateStr);
      const day = d.getUTCDate();
      const month = months[d.getUTCMonth()];
      const year = d.getUTCFullYear();
      if (region === 'usa' || region === 'canada') {
        return `${month} ${day}, ${year}`;
      }
      return `${day} ${month} ${year}`;
    }

    // ===== HELPER: ESCAPE HTML =====
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== RENDER SIDEBAR =====
    function renderSidebar() {
      docList.innerHTML = '';
      mobileSelect.innerHTML = '<option value="">Select Document Type...</option>';

      DOCUMENT_TYPES.forEach(doc => {
        const li = document.createElement('li');
        li.className = 'doc-item';
        li.dataset.id = doc.id;
        li.innerHTML = `<span class="doc-icon">${doc.icon}</span><span>${doc.name}</span>`;
        li.addEventListener('click', () => selectDocument(doc.id));
        docList.appendChild(li);

        const option = document.createElement('option');
        option.value = doc.id;
        option.textContent = `${doc.icon} ${doc.name}`;
        mobileSelect.appendChild(option);
      });
    }

    // ===== CHANGE REGION =====
    function changeRegion(region) {
      currentRegion = region;
      if (currentDoc) {
        renderForm();
        updatePreview();
      }
    }

    // ===== DOCUMENT SWITCHER =====
    function selectDocument(docId) {
      document.querySelectorAll('.doc-item').forEach(item => item.classList.remove('active'));
      
      const activeItem = document.querySelector(`.doc-item[data-id="${docId}"]`);
      if (activeItem) activeItem.classList.add('active');

      mobileSelect.value = docId;

      currentDoc = DOCUMENT_TYPES.find(d => d.id === docId);
      if (!currentDoc) return;

      emptyState.style.display = 'none';
      formContent.style.display = 'block';

      docTitle.textContent = `${currentDoc.icon} ${currentDoc.name}`;

      renderForm();
      updatePreview();
    }

    // ===== RENDER FORM FIELDS =====
    function renderForm() {
      formGrid.innerHTML = '';
      const fields = currentDoc.getFields(currentRegion);

      fields.forEach(field => {
        const wrapper = document.createElement('div');
        wrapper.className = 'form-field';
        if (field.type === 'textarea') wrapper.classList.add('full-width');

        let inputHtml = '';

        if (field.type === 'select') {
          inputHtml = `<select class="form-select" data-key="${field.key}" data-type="${field.type}">
            <option value="">-- Select --</option>
            ${field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
          </select>`;
        } else if (field.type === 'textarea') {
          inputHtml = `<textarea class="form-textarea" data-key="${field.key}" data-type="${field.type}" placeholder="${field.placeholder || ''}"></textarea>
          <div class="char-count">0 characters</div>`;
        } else {
          inputHtml = `<input type="${field.type}" class="form-input" data-key="${field.key}" data-type="${field.type}" placeholder="${field.placeholder || ''}">`;
        }

        wrapper.innerHTML = `
          <label class="form-label">${field.label}</label>
          ${inputHtml}
          ${field.hint ? `<div class="field-hint">${field.hint}</div>` : ''}
        `;

        formGrid.appendChild(wrapper);
      });
    }

    // ===== REAL-TIME PREVIEW UPDATE =====
    function updatePreview() {
      if (!currentDoc) return;

      const inputs = formGrid.querySelectorAll('input, select, textarea');
      const values = {};

      inputs.forEach(input => {
        const key = input.dataset.key;
        const type = input.dataset.type;
        let val = input.value.trim();

        if (type === 'date' && val) {
          val = formatDate(val, currentRegion);
        }

        values[key] = val;
      });

      let template = currentDoc.getTemplate(currentRegion);
      let html = escapeHtml(template);

      const fields = currentDoc.getFields(currentRegion);
      fields.forEach(field => {
        const placeholder = getPlaceholderKey(field.key);
        const regex = new RegExp(`\\{\\{${placeholder}\\}\\}`, 'g');
        const val = values[field.key];

        if (!val) {
          html = html.replace(regex, `<span class="placeholder-hint">[${field.label}]</span>`);
        } else {
          html = html.replace(regex, escapeHtml(val));
        }
      });

      previewContent.innerHTML = `<div class="document-paper">${html}</div>`;
    }

    // ===== PRINT / DOWNLOAD =====
    function printDocument() {
      const paper = previewContent.querySelector('.document-paper');
      if (!paper) return;

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>${currentDoc ? currentDoc.name : 'Document'}</title>
            <style>
              body { 
                font-family: 'Times New Roman', Times, serif; 
                font-size: 12pt; 
                line-height: 1.6; 
                margin: 2cm; 
                color: #000; 
                background: #fff; 
              }
              .placeholder-hint { 
                color: #B45309; 
                font-weight: bold; 
                background: #FEF3C7; 
                padding: 2px 4px; 
              }
              pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
            </style>
          </head>
          <body>
            <pre>${paper.innerHTML}</pre>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.print();
    }

    // ===== COPY TO CLIPBOARD =====
    function copyToClipboard() {
      const paper = previewContent.querySelector('.document-paper');
      if (!paper) return;

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = paper.innerHTML;
      const plainText = tempDiv.textContent || tempDiv.innerText || '';

      navigator.clipboard.writeText(plainText).then(() => {
        const btn = document.querySelector('.copy-btn');
        const original = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = original, 1500);
      }).catch(err => {
        console.error('Copy failed:', err);
      });
    }

    // ===== EVENT LISTENERS =====
    formGrid.addEventListener('input', (e) => {
      if (e.target.matches('input, select, textarea')) {
        if (e.target.tagName === 'TEXTAREA') {
          const counter = e.target.parentElement.querySelector('.char-count');
          if (counter) {
            counter.textContent = `${e.target.value.length} characters`;
          }
        }
        updatePreview();
      }
    });

    mobileSelect.addEventListener('change', (e) => {
      if (e.target.value) {
        selectDocument(e.target.value);
      }
    });

    // ===== INITIALIZE =====
    renderSidebar();
  </script>
</body>
</html>
